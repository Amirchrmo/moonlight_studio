<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />

    <!-- Apply the saved theme before first paint (prevents a dark/light flash). -->
    <script>
      try {
        var t = localStorage.getItem('moonlight-theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>

    <!-- Primary SEO (keep in sync with `site.seo` in src/content/pageContent.js) -->
    <title>Moonlight Studio — Luxury Photography</title>
    <meta
      name="description"
      content="Moonlight Studio is a luxury photography studio crafting cinematic, timeless imagery — commercial, portrait, fashion, wedding and editorial photography."
    />
    <meta name="author" content="Moonlight Studio" />
    <link rel="canonical" href="https://moonlightstudioo.ir/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / social preview (og-image.jpg is generated from images/site/hero.jpg) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Moonlight Studio" />
    <meta property="og:url" content="https://moonlightstudioo.ir/" />
    <meta property="og:title" content="Moonlight Studio — Luxury Photography" />
    <meta property="og:description" content="Cinematic, timeless imagery from a luxury photography studio." />
    <meta property="og:image" content="https://moonlightstudioo.ir/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Moonlight Studio",
        "url": "https://moonlightstudioo.ir/",
        "description": "Luxury photography studio.",
        "image": "https://moonlightstudioo.ir/og-image.jpg",
        "logo": "https://moonlightstudioo.ir/logo.png",
        "telephone": "+989145321207",
        "sameAs": ["https://instagram.com/moonlight.studio"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
