<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Primary SEO -->
    <title>Moonlight Studio — Luxury Photography</title>
    <meta
      name="description"
      content="Moonlight Studio is a luxury photography studio crafting cinematic, timeless imagery — commercial, portrait, fashion, wedding and editorial photography."
    />
    <meta name="author" content="Moonlight Studio" />
    <link rel="canonical" href="https://moonlight.studio/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Moonlight Studio — Luxury Photography" />
    <meta
      property="og:description"
      content="Cinematic, timeless imagery from a luxury photography studio."
    />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- Fonts: preconnect + non-blocking load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Moonlight Studio",
        "description": "Luxury photography studio.",
        "image": "/logo.png",
        "telephone": "+1 (415) 555-0199",
        "priceRange": "$$$",
        "sameAs": ["https://instagram.com/moonlight.studio"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
