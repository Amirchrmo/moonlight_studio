services:
  nginx:
    image: nginx:1.27-alpine
    container_name: moonlight-nginx
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy-net
      - moonlight_internal

networks:
  proxy-net:
    external: true
  moonlight_internal:
    driver: bridge
