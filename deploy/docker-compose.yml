services:
  nginx:
    image: nginx:1.27-alpine
    container_name: moonlight-nginx
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      # releases/<id>/ = one build each; releases/current -> active release.
      # The symlink is resolved per request, so switching it is an instant,
      # atomic deploy/rollback with no container restart (see scripts/deploy.sh).
      - ./releases:/srv/www:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./acme:/var/www/acme:ro
    networks:
      - proxy-net
      - moonlight_internal

networks:
  proxy-net:
    external: true
  moonlight_internal:
    driver: bridge
