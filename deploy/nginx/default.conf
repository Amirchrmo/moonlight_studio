# Moonlight Studio — static SPA served by the `moonlight-nginx` container.
# TLS is terminated in front of this by Nginx Proxy Manager (proxy host #5).
server {
    listen 80;
    server_name _;

    root /srv/www/current;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Let's Encrypt HTTP-01 renewals (certbot --webroot -w /opt/moonlight/acme)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Content-hashed build output (JS/CSS/fonts) and images: cache forever.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location ^~ /img/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Other static files at the root (logo, favicon, og-image): short cache.
    location ~* \.(?:png|jpe?g|webp|avif|svg|ico|txt|xml|webmanifest)$ {
        expires 1d;
        try_files $uri =404;
    }

    # SPA: every route serves index.html, which must never be cached stale.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ /index.html;
    }
}
